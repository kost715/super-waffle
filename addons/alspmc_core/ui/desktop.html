<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЧВК — командный центр</title>
<style>
:root{--bg:#0b1015;--panel:#141d25;--panel2:#1b2833;--line:#273744;--text:#edf4f7;--dim:#91a4b0;--faint:#6b8190;--accent:#53d4ae;--bad:#f78484;--warn:#e8c978;color-scheme:dark}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font:15px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 5% 0%,#1b3a3d 0%,transparent 50%),#080d12;padding:2.3vh;user-select:none}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
select{width:100%;box-sizing:border-box;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}
.workstation{height:100%;display:flex;flex-direction:column;border:1px solid #37505b;border-radius:13px;background:var(--bg);box-shadow:0 24px 90px #0009;overflow:hidden}
.titlebar{height:47px;display:flex;align-items:center;gap:13px;padding:0 18px;border-bottom:1px solid var(--line);background:#16232b;flex-shrink:0}
.shield{width:25px;height:28px;color:var(--accent)}.system-name{font-size:12px;font-weight:700;letter-spacing:.14em}.window-label{color:var(--dim);font-size:12px;margin-left:auto}
.window-close{border:0;background:none;color:var(--dim);font-size:23px;padding:2px 9px;border-radius:5px}.window-close:hover{background:#5d2b34;color:white}
.workspace{display:flex;min-height:0;flex:1}.sidebar{width:235px;flex-shrink:0;border-right:1px solid var(--line);padding:25px 15px;background:linear-gradient(160deg,#14242c,#101920);display:flex;flex-direction:column}
.brand{font-size:24px;font-weight:700;letter-spacing:-.03em;padding:0 13px}.brand-note{font-size:12px;color:var(--dim);padding:2px 13px 26px}.nav-label{font-size:10px;letter-spacing:.16em;color:var(--faint);padding:0 13px 9px}
nav{display:grid;gap:6px}nav button{border:1px solid transparent;border-radius:7px;background:none;color:#acbec8;text-align:left;padding:11px 13px;font-size:13px}nav button:hover{background:#20313c}nav button[aria-current=true]{background:#1f3d3c;color:#9cf3d5;border-color:#315c52}
.sidebar-bottom{margin-top:auto;padding:25px 12px 0;color:var(--dim);font-size:11px}.online{color:var(--accent);display:flex;align-items:center;gap:7px}.online:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.logout{margin-top:14px;background:none;color:#b5c6ce;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;font-size:11px}
.content{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{padding:22px 30px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;flex-shrink:0}.eyebrow{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.15em}.toolbar h1{font-size:23px;margin:4px 0 0;font-weight:650;letter-spacing:-.02em}.session{font-size:11px;color:var(--dim);text-align:right}
.scroll{flex:1;min-height:0;overflow:auto;padding:24px 30px 30px}#alspmc-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:17px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:21px;min-width:0}.card.active{background:linear-gradient(125deg,#1b3636,#17242c);border-color:#315a53}
#alspmc-section-summary{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;column-gap:20px;align-items:center}#alspmc-title{font-size:25px;letter-spacing:-.02em}#alspmc-progress{grid-column:1}#alspmc-funds{grid-column:2;grid-row:1/3;font-size:15px;color:#b3dfd0;text-align:right}#alspmc-section-base,#alspmc-section-quests,#alspmc-confirm,#alspmc-notice{grid-column:1/-1}
.k{font-size:10px;color:var(--accent);letter-spacing:.13em;font-weight:700;margin-bottom:12px}.cargo{font-size:17px;font-weight:650;overflow-wrap:anywhere}.note{font-size:12px;line-height:1.6;color:var(--dim);margin-top:9px}.meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.btn{border:1px solid #4ed1a7;background:var(--accent);color:#062319;border-radius:6px;font-size:12px;font-weight:650;min-height:35px;padding:8px 13px}.btn:hover:not(:disabled){filter:brightness(1.12)}.btn.ghost{background:#20303b;border-color:#354955;color:#c9dce6}.btn.danger{background:#37232b;border-color:#5d3b46;color:#f4acb2}
input{display:block;user-select:text;width:100%;margin-top:9px;padding:12px 13px;color:var(--text);background:#101a22;border:1px solid #364c5a;border-radius:6px;font-size:14px}.alspmc-site{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.alspmc-notice{margin:0;background:#173631;border:1px solid #3c7b67;border-radius:7px;padding:13px 16px;color:#b5e9d6}.empty{padding:45px 20px;color:var(--dim);text-align:center}
[hidden]{display:none!important}.statusbar{height:31px;display:flex;justify-content:space-between;padding:6px 17px;background:#101920;border-top:1px solid var(--line);font-size:10px;color:var(--faint);flex-shrink:0}::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#3a525e;border-radius:8px}::-webkit-scrollbar-track{background:#101920}
body[data-section=name] #alspmc-section-license,body[data-section=name] #alspmc-section-base,body[data-section=base] #alspmc-section-license,body[data-section=base] #alspmc-section-name,body[data-section=license] #alspmc-section-name,body[data-section=license] #alspmc-section-base{display:none}
body:not([data-section=summary]) #alspmc-section-name,body:not([data-section=summary]) #alspmc-section-license{grid-column:1/-1}
body[data-section=quests] #alspmc-section-name,body[data-section=quests] #alspmc-section-license,body[data-section=quests] #alspmc-section-base,body[data-section=name] #alspmc-section-quests,body[data-section=base] #alspmc-section-quests,body[data-section=license] #alspmc-section-quests{display:none}
#alspmc-quest-tabs [aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
@media(max-width:980px){body{font-size:13px;padding:12px}.sidebar{width:185px;padding:20px 10px}.brand{font-size:21px}.toolbar{padding:18px 22px}.scroll{padding:18px 22px}#alspmc-body{grid-template-columns:1fr}.card{padding:17px}#alspmc-section-summary{display:block}#alspmc-funds{text-align:left;margin-top:12px}}
@media(max-width:680px){.sidebar{width:145px}.brand{font-size:18px}.brand-note{font-size:10px}.toolbar{padding:15px}.toolbar h1{font-size:18px}.scroll{padding:15px}.session{display:none}nav button{padding:10px;font-size:11px}}
</style>
</head>
<body data-section="summary">
<div class="workstation">
  <header class="titlebar"><svg class="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="M8 12l3 3 5-6"/></svg><span class="system-name">ЧВК · КОМАНДНЫЙ ЦЕНТР</span><span class="window-label">Рабочее место на базе</span><button class="window-close" data-desktop-close aria-label="Закрыть">×</button></header>
  <div class="workspace">
    <aside class="sidebar"><div class="brand">Штаб ЧВК</div><div class="brand-note">Управление организацией</div><div class="nav-label">РАБОЧИЕ РАЗДЕЛЫ</div>
      <nav aria-label="Разделы управления"><button data-section="summary" aria-current="true">Обзор</button><button data-section="name" aria-current="false">Организация</button><button data-section="base" aria-current="false">Недвижимость и база</button><button data-section="quests" aria-current="false">Контракты ЧВК</button><button data-section="license" aria-current="false">Лицензия</button></nav>
      <div class="sidebar-bottom"><div class="online">Связь с ЧВК</div><div>Общие данные с телефоном</div><button class="logout" data-desktop-close>Завершить сеанс</button></div>
    </aside>
    <main class="content"><div class="toolbar"><div><div class="eyebrow">ПАНЕЛЬ УПРАВЛЕНИЯ</div><h1 id="section-title">Обзор ЧВК</h1></div><div class="session" id="session-label">Подключение к данным…</div></div>
      <div class="scroll" id="desktop-scroll"><div id="v-alspmc"></div></div>
    </main>
  </div>
  <footer class="statusbar"><span>LifeSim PMC · Штаб</span><span>Данные обновляются автоматически</span></footer>
</div>
<script>
let application;
function send(msg) {
  const raw=JSON.stringify(msg);
  if(window.A3API&&A3API.SendAlert) A3API.SendAlert(raw);
  else if(/arma|a3/i.test(navigator.userAgent)) alert(raw);
}
function app(definition) {
  application=definition;
  document.getElementById('v-alspmc').innerHTML=definition.shell;
}
window.ALSPMCDesktop={
  start(){if(application&&application.open)application.open();},
  onState(state){
    document.getElementById('session-label').textContent=state.bases&&state.bases.length?'База подключена · '+state.bases[0].grid:'Данные ЧВК подключены';
  }
};
document.addEventListener('click',event=>{
  const close=event.target.closest('[data-desktop-close]');
  if(close)return send({a:'alspmcDesktop',op:'close'});
  const section=event.target.closest('nav [data-section]');
  if(section){
    document.body.dataset.section=section.dataset.section;
    document.querySelectorAll('nav [data-section]').forEach(el=>el.setAttribute('aria-current',String(el===section)));
    document.getElementById('section-title').textContent=section.textContent==='Обзор'?'Обзор ЧВК':section.textContent;
    document.getElementById('desktop-scroll').scrollTop=0;
    return;
  }
  for(const selector in(application&&application.clicks||{})){
    const target=event.target.closest(selector);
    if(target)return application.clicks[selector](target,event);
  }
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){
    if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))document.activeElement.blur();
    else send({a:'alspmcDesktop',op:'close'});
  }
});
send({a:'alspmcDesktop',op:'ready'});
</script>
</body>
</html>
